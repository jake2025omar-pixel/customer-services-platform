name: Fix Pages
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci || npm install --legacy-peer-deps
      - run: npm run build
      - run: |
          if [ -d "./dist/public" ]; then echo "PUB=./dist/public" >> $GITHUB_ENV; else echo "PUB=./dist" >> $GITHUB_ENV; fi
          ls -la $PUB
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ env.PUB }}
